<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Animal NGOs of India</title>
<meta name="description" content="Find animal welfare, rescue, wildlife and gaushala organisations across every state and district of India, with contacts, who runs them and sources.">
<meta name="theme-color" content="#f5f5f5">
<meta property="og:title" content="Animal NGOs of India">
<meta property="og:description" content="Animal welfare, rescue and wildlife groups across India, with contacts, who runs them and sources.">
<meta property="og:type" content="website">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<!--STYLES--><link rel="stylesheet" href="styles.css"><!--/STYLES-->
</head>
<body>
<svg class="sprite" aria-hidden="true"><defs>
  <symbol id="i-grid" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/></symbol>
  <symbol id="i-pin" viewBox="0 0 24 24"><path d="M12 21s-7-6.2-7-11.5a7 7 0 0 1 14 0C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="10" cy="10" r="7"/><path d="m15 15 6 6"/></symbol>
  <symbol id="i-filter" viewBox="0 0 24 24"><path d="M3 7h18M3 17h18"/><circle cx="9" cy="7" r="3" class="hole"/><circle cx="15" cy="17" r="3" class="hole"/></symbol>
  <symbol id="i-link" viewBox="0 0 24 24"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></symbol>
  <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.5"/></symbol>
  <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M7 17 17 7M7 7h10v10"/></symbol>
  <symbol id="i-back" viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></symbol>
  <symbol id="i-paw" viewBox="0 0 24 24"><ellipse cx="12" cy="16" rx="4.5" ry="3.8"/><circle cx="6" cy="10.5" r="1.9"/><circle cx="9.6" cy="6.6" r="1.9"/><circle cx="14.4" cy="6.6" r="1.9"/><circle cx="18" cy="10.5" r="1.9"/></symbol>
  <symbol id="i-leaf" viewBox="0 0 24 24"><path d="M5 19c0-8 5-14 15-14 0 10-6 15-14 15"/><path d="M5 19 13 11"/></symbol>
  <symbol id="i-cow" viewBox="0 0 24 24"><path d="M6 8 3 6M18 8l3-2"/><rect x="6" y="7" width="12" height="11" rx="5"/><path d="M9.5 15h.01M14.5 15h.01"/></symbol>
</defs></svg>

<div class="shell">
  <aside class="rail" aria-label="Sections">
    <a class="logo" href="#" aria-label="Animal NGOs of India, home"><i></i><i></i><i></i><i></i></a>
    <nav class="railnav">
      <button class="round" type="button" data-go="home" aria-label="Overview" title="Overview"><svg class="icon"><use href="#i-grid"/></svg></button>
      <button class="round" type="button" data-go="states" aria-label="All states" title="All states"><svg class="icon"><use href="#i-pin"/></svg></button>
      <button class="round" type="button" data-go="search" aria-label="Search" title="Search"><svg class="icon"><use href="#i-search"/></svg></button>
      <button class="round" type="button" data-go="filters" aria-label="Filters" title="Filters"><svg class="icon"><use href="#i-filter"/></svg></button>
      <button class="round mobile-only" type="button" data-go="share" aria-label="Copy link" title="Copy link"><svg class="icon"><use href="#i-link"/></svg></button>
    </nav>
    <div class="railbottom">
      <button class="round" type="button" data-go="about" aria-label="About the data" title="About the data"><svg class="icon"><use href="#i-info"/></svg></button>
    </div>
  </aside>

  <header class="top">
    <nav class="types" id="types" aria-label="Type of group"></nav>
    <label class="searchbox" id="searchbox">
      <svg class="icon"><use href="#i-search"/></svg>
      <input id="q" type="search" autocomplete="off" placeholder="Group, person or town" aria-label="Search groups, people or towns">
      <button class="clear" id="clear" type="button" aria-label="Clear search"><svg class="icon"><use href="#i-x"/></svg></button>
    </label>
  </header>

  <section class="intro">
    <div class="intro-text">
      <div class="crumbs" id="crumbs"></div>
      <h1 id="title">Animal NGOs of India</h1>
      <div class="muted" id="sub">Loading the directory...</div>
    </div>
    <div class="tools">
      <button class="round" id="filterBtn" type="button" aria-label="Filters" aria-expanded="false" aria-controls="filters"><svg class="icon"><use href="#i-filter"/></svg><span class="dot" id="filterDot"></span></button>
      <button class="pill blue" id="share" type="button"><svg class="icon"><use href="#i-link"/></svg>Copy link</button>
    </div>
  </section>

  <div class="filters card" id="filters" hidden>
    <label><input type="checkbox" id="fContact"> Has a phone or email</label>
    <label><input type="checkbox" id="fPeople"> We know who runs it</label>
    <label><input type="checkbox" id="fAwbi"> AWBI recognised</label>
    <label><input type="checkbox" id="fVerified"> Hide unverified web finds</label>
  </div>

  <main id="view" aria-live="polite">
    <div class="loading"><div class="skel"></div><div class="skel"></div><div class="skel"></div></div>
  </main>

  <footer class="foot" id="foot" hidden></footer>
</div>
<div class="toast" id="toast" role="status"></div>
<!--DATA--><!--/DATA-->
<!--SCRIPT--><script src="app.js" defer></script><!--/SCRIPT-->
</body>
</html>

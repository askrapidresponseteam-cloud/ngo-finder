<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Karnataka Animal NGOs</title>
<meta name="description" content="Find animal welfare, rescue, wildlife and gaushala organisations across every district of Karnataka, with contacts, who runs them and sources.">
<meta name="theme-color" content="#2E6B57">
<meta property="og:title" content="Karnataka Animal NGOs">
<meta property="og:description" content="Animal welfare, rescue and wildlife groups across Karnataka, with contacts, who runs them and sources.">
<meta property="og:type" content="website">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<!--STYLES--><link rel="stylesheet" href="styles.css"><!--/STYLES-->
</head>
<body>
<div class="wrap">
  <h1>Karnataka animal NGOs</h1>
  <p class="sub" id="sub">Loading the directory...</p>

  <div class="search" id="searchbox">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
    <input id="q" type="search" autocomplete="off" placeholder="Group, person or town" aria-label="Search groups, people or towns">
    <button class="clear" id="clear" type="button" aria-label="Clear search">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </div>

  <div class="pills" id="pills" role="group" aria-label="Type of group"></div>
  <button class="more-toggle" id="ftoggle" type="button" aria-expanded="false" aria-controls="filters">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" aria-hidden="true"><path d="M12 5v14M5 12h14" class="fv"/></svg>
    <span>More filters</span>
  </button>
  <div class="filters" id="filters">
    <label><input type="checkbox" id="fContact"> Only groups with a phone or email</label>
    <label><input type="checkbox" id="fPeople"> Only groups where we know who runs it</label>
    <label><input type="checkbox" id="fAwbi"> Only AWBI recognised groups</label>
    <label><input type="checkbox" id="fVerified"> Hide unverified web finds</label>
  </div>

  <main id="view" aria-live="polite">
    <div class="loading"><div class="bar-skel"></div><div class="bar-skel"></div><div class="bar-skel"></div></div>
  </main>

  <footer class="foot" id="foot"></footer>
</div>
<div class="toast" id="toast" role="status"></div>
<!--DATA--><!--/DATA-->
<!--SCRIPT--><script src="app.js" defer></script><!--/SCRIPT-->
</body>
</html>

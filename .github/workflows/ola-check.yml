name: Ola Maps check

# A few test calls to Ola Maps (about 7 requests): confirms the key works and shows
# which fields the basic and advanced place details return (phone, website).
# The result lines appear as notices on the run page.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OLA_MAPS_API_KEY: ${{ secrets.OLA_MAPS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Check the Ola Maps key and the details fields
        run: python -m scraper --ola-check
